name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, lint and Bun tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: '24.21.0'
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:ci
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-test-reports
          path: |
            artifacts/test/
            coverage/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Installed package on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.9.0', '24.21.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node }}
      - run: bun run verify:package
      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-node-${{ matrix.node }}
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 14
